name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        run: rustup default stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        run: node scripts/check-release-version.mjs

      - name: Run tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Check Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Lint Rust
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri

      - name: Build and draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: ScreenBreak ${{ github.ref_name }}
          releaseDraft: true
          generateReleaseNotes: true
          uploadUpdaterJson: true
