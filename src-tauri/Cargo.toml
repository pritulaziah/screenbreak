[package]
name = "screenbreak"
version = "0.2.0"
description = "Break reminders without blocking the screen"
authors = ["pritulaziah"]
license = "MIT"
repository = "https://github.com/pritulaziah/screenbreak"
edition = "2024"
rust-version = "1.87"

[lib]
# The `_lib` suffix avoids a name conflict with the binary on Windows.
name = "screenbreak_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14.1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
